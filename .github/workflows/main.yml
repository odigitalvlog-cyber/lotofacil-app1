name: Criar APK Lotofacil

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código
        uses: actions/checkout@v3

      # --- A CORREÇÃO ESTÁ AQUI EMBAIXO ---
      - name: Configurar Java 11 (Obrigatório para Android)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good libltdl-dev libffi-dev libssl-dev autoconf libtool automake
          pip3 install --upgrade pip
          pip3 install buildozer cython==0.29.33

      - name: Construir APK
        run: |
          yes | buildozer android debug

      - name: Enviar APK Pronto
        uses: actions/upload-artifact@v4
        with:
          name: lotofacil-apk
          path: bin/*.apk
